name: Build and Deploy to Azure

# Builds both images with secrets baked in via --build-arg and pushes them to
# the PRIVATE ACR (comicreadersite.azurecr.io).
#
# NOTE: The public GHCR workflow (ghcr.yml) builds the SAME Dockerfiles but
# passes NO secret build-args, so the GHCR images stay clean. Secrets only
# ever land in the private ACR images.

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: comicreadersite.azurecr.io
  IMAGE_BACKEND: backend
  IMAGE_FRONTEND: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ACR_NAME # secrets below come from this GitHub environment
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Comic/Dockerfile declares ARG DB_URL/DB_USER/DB_PASSWORD/SMTP_USERNAME/
      # SMTP_APP_PASSWORD/AZURE_BLOB_CONNECTION_STRING/AZURE_BLOB_CONTAINER and
      # promotes them to ENV, so the container boots with all secrets present.
      - name: Build backend image (secrets via build-args)
        run: |
          docker build \
            --build-arg DB_URL="${{ secrets.DB_URL }}" \
            --build-arg DB_USER="${{ secrets.DB_USER }}" \
            --build-arg DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --build-arg SMTP_USERNAME="${{ secrets.MAIL_USER }}" \
            --build-arg SMTP_APP_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            --build-arg AZURE_BLOB_CONNECTION_STRING="${{ secrets.AZURE_BLOB_CONNECTION_STRING }}" \
            --build-arg AZURE_BLOB_CONTAINER="${{ secrets.AZURE_BLOB_CONTAINER }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:latest ./Comic

      # Public API base URL baked into the client bundle (not a secret).
      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE="${{ vars.NEXT_PUBLIC_API_BASE || 'https://backend-comicreadersite.wonderfulbay-fb92c756.eastasia.azurecontainerapps.io/Comic/api' }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:latest ./ComicReaderSite

      - name: Push images
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:latest
